name: Docker Install Images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.1.2) — used for image tags'
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/extphprs/grpc-php-rs

jobs:
  build-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5', '8.6']
        ts: ['nts', 'zts']
        libc: ['glibc', 'musl']
        exclude:
          # Official php:8.6 images are ZTS-only (no separate -zts tags).
          - php: '8.6'
            ts: 'zts'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version and PHP image
        id: meta
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "${{ matrix.libc }}" == "musl" ]]; then
            ALPINE_SUFFIX="-alpine"
            DOCKERFILE="docker/Dockerfile.alpine"
            if [[ "${{ matrix.ts }}" == "zts" ]]; then
              echo "php_image=php:${{ matrix.php }}-zts-alpine" >> "$GITHUB_OUTPUT"
            else
              echo "php_image=php:${{ matrix.php }}-alpine" >> "$GITHUB_OUTPUT"
            fi
          else
            ALPINE_SUFFIX=""
            DOCKERFILE="docker/Dockerfile"
            if [[ "${{ matrix.ts }}" == "zts" ]]; then
              echo "php_image=php:${{ matrix.php }}-zts" >> "$GITHUB_OUTPUT"
            else
              echo "php_image=php:${{ matrix.php }}-cli" >> "$GITHUB_OUTPUT"
            fi
          fi

          if [[ "${{ matrix.ts }}" == "zts" ]]; then
            TS_SUFFIX="-zts"
          else
            TS_SUFFIX=""
          fi

          echo "dockerfile=${DOCKERFILE}" >> "$GITHUB_OUTPUT"

          {
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}-php${{ matrix.php }}${ALPINE_SUFFIX}${TS_SUFFIX}"
            echo "${IMAGE}:latest-php${{ matrix.php }}${ALPINE_SUFFIX}${TS_SUFFIX}"
            if [[ "${{ matrix.php }}" == "8.6" ]]; then
              echo "${IMAGE}:${VERSION}-php8.6${ALPINE_SUFFIX}-zts"
              echo "${IMAGE}:latest-php8.6${ALPINE_SUFFIX}-zts"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.meta.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PHP_IMAGE=${{ steps.meta.outputs.php_image }}
          labels: |
            org.opencontainers.image.source=https://github.com/extphprs/grpc-php-rs
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=php${{ matrix.php }}-${{ matrix.ts }}-${{ matrix.libc }}
          cache-to: type=gha,mode=max,scope=php${{ matrix.php }}-${{ matrix.ts }}-${{ matrix.libc }}
