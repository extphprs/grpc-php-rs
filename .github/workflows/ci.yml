name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      clang: "21"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
      - name: Cache LLVM and Clang
        id: cache-llvm
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/llvm-${{ env.clang }}
          key: ubuntu-latest-llvm-${{ env.clang }}
      - name: Setup LLVM & Clang
        id: clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.clang }}
          directory: ${{ runner.temp }}/llvm-${{ env.clang }}
          cached: ${{ steps.cache-llvm.outputs.cache-hit }}
      - name: Configure Clang
        run: |
          {
            echo "LIBCLANG_PATH=${{ runner.temp }}/llvm-${{ env.clang }}/lib"
            echo "LLVM_VERSION=${{ steps.clang.outputs.version }}"
            echo "LLVM_CONFIG_PATH=${{ runner.temp }}/llvm-${{ env.clang }}/bin/llvm-config"
          } >> "$GITHUB_ENV"
      - name: cargo check
        run: cargo check
      - name: cargo clippy
        run: cargo clippy -- -D warnings
      - name: cargo test
        run: cargo test

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and run core suites
        run: ./test.sh all

  zts-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: ZTS stress test (FrankenPHP, 200 concurrent gRPC+TLS requests)
        run: ./test.sh zts
