[package]
name = "grpc-php-rs"
version = "0.5.0"
edition = "2024"

[lib]
name = "grpc_php_rs"
crate-type = ["cdylib"]

[lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
disallowed_types = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = true
codegen-units = 1

[dependencies]
ext-php-rs = { version = "0.16.5", features = ["closure"] }
tonic = { version = "0.14.9", default-features = false, features = ["transport", "tls-ring", "tls-webpki-roots"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7.20"
tokio-stream = "0.1.19"
parking_lot = "0.13"
bytes = "1.12"
http = "1.5"
h2 = "0.4.20"
thiserror = "2.0.21"
